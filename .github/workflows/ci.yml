name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          # Tests should not require real API keys to pass — mock the LLM/search
          # calls in tests/. These dummy values exist only so code that does
          # os.environ["GROQ_API_KEY"] doesn't KeyError during collection/import
          # if a test module imports src.common.llm_provider at module load time.
          GROQ_API_KEY: dummy-ci-key
          TAVILY_API_KEY: dummy-ci-key
        run: |
          pytest tests/ -v